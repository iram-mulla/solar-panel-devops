<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Panel Defect Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 30px;
        }
        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 25px;
            border-radius: 15px 15px 0 0;
        }
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .result-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .confidence-bar {
            height: 8px;
            border-radius: 4px;
            margin: 5px 0;
        }
        .recommendation-box {
            background: #e8f4fd;
            border-left: 4px solid #007bff;
            padding: 15px;
            border-radius: 5px;
        }
        .image-preview {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="main-card">
                    <div class="header text-center">
                        <h1>☀️ Solar Panel Defect Detection</h1>
                        <p class="mb-0">Upload an image to detect defects and get cleaning recommendations</p>
                    </div>
                    
                    <div class="p-4">
                        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                            <div id="uploadContent">
                                <h3>📁 Click to Upload Image</h3>
                                <p class="text-muted">Supported formats: JPG, JPEG, PNG</p>
                            </div>
                            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                            <img id="previewImage" class="image-preview mt-3" style="display: none;">
                        </div>
                        
                        <div class="text-center mt-3">
                            <button class="btn btn-primary btn-lg" id="predictBtn" onclick="predictDefect()" disabled>
                                🔍 Analyze Image
                            </button>
                        </div>
                        
                        <div id="loader" class="text-center" style="display: none;">
                            <div class="loader"></div>
                            <p>Analyzing image...</p>
                        </div>
                        
                        <div id="results" style="display: none;">
                            <div class="result-card">
                                <h4 id="resultTitle" class="text-center mb-3"></h4>
                                
                                <div class="row">
                                    <div class="col-md-6">
                                        <h5>Prediction Details</h5>
                                        <div id="predictionDetails"></div>
                                        
                                        <h5 class="mt-3">All Probabilities</h5>
                                        <div id="probabilityBars"></div>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <h5>Cleaning Recommendation</h5>
                                        <div id="recommendationBox" class="recommendation-box"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('predictBtn').disabled = false;
                
                // Show preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('previewImage').style.display = 'block';
                    document.getElementById('uploadContent').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        async function predictDefect() {
            if (!selectedFile) return;
            
            // Show loader
            document.getElementById('loader').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Hide loader
                document.getElementById('loader').style.display = 'none';
                
                if (data.success) {
                    displayResults(data);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                alert('Error connecting to server: ' + error.message);
            }
        }

        function displayResults(data) {
            document.getElementById('results').style.display = 'block';
            
            // Title
            const badgeClass = data.recommendation.badge_class;
            document.getElementById('resultTitle').innerHTML = `
                <span class="badge ${badgeClass} fs-4">${data.predicted_class.toUpperCase()}</span>
                <br>
                <small class="text-muted">Confidence: ${data.confidence}%</small>
            `;
            
            // Prediction details
            document.getElementById('predictionDetails').innerHTML = `
                <p><strong>Action Required:</strong> ${data.recommendation.action}</p>
                <p><strong>Priority Level:</strong> 
                    <span class="badge ${data.recommendation.badge_class}">${data.recommendation.priority}</span>
                </p>
                <p><strong>Estimated Energy Gain:</strong> ${data.recommendation.energy_gain}</p>
            `;
            
            // Probability bars
            let probHTML = '';
            data.probabilities.forEach(([cls, prob]) => {
                const barClass = cls === data.predicted_class ? 'bg-primary' : 'bg-secondary';
                probHTML += `
                    <div>
                        <strong>${cls}:</strong> ${prob}%
                        <div class="progress" style="height: 20px; margin: 5px 0;">
                            <div class="progress-bar ${barClass}" style="width: ${prob}%">
                                ${prob}%
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('probabilityBars').innerHTML = probHTML;
            
            // Recommendation
            document.getElementById('recommendationBox').innerHTML = `
                <h5>🔧 ${data.recommendation.action}</h5>
                <p class="mb-0">${data.recommendation.description}</p>
            `;
        }
    </script>
</body>
</html>
