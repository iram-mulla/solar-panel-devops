version: '3.8'

services:
  solar-panel-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - MLFLOW_LOG_PREDICTIONS=true
    depends_on:
      - mlflow-server
    restart: unless-stopped

  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/app/mlflow_data
    restart: unless-stopped