version: '3.8'

services:
  solar-panel-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - FLASK_ENV=development
    restart: unless-stopped

  mlflow-server:
    image: python:3.9-slim
    command: |
      sh -c "pip install mlflow && mlflow server --backend-store-uri sqlite:///app/mlflow.db --default-artifact-root file:///app/mlflow-artifacts --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/app
    restart: unless-stopped