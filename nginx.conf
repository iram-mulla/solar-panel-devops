events {
    worker_connections 1024;
}

http {
    upstream api {
        server solar-panel-api:8000;
    }

    server {
        listen 80;
        
        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /health {
            proxy_pass http://api/health;
            proxy_set_header Host $host;
        }
    }
}