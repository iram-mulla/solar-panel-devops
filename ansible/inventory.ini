# Replace with your EC2 public IP after provisioning
[solar_panel_servers]
solar-app ansible_host=YOUR_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/solar-panel-key.pem

[solar_panel_servers:vars]
app_port=8000
mlflow_port=5000
ecr_image=YOUR_AWS_ACCOUNT.dkr.ecr.YOUR_REGION.amazonaws.com/solar-panel-devops:latest
app_dir=/opt/solar-panel-devops
